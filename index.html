<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Personal Diary</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Special+Elite&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* A4 Aspect Ratio: 1 : 1.414 */
      --page-w: 420px;
      --page-h: 594px;
      --line-h: 28px;
      --paper-bg: #faf7ee;
      --line-color: rgba(65, 105, 155, 0.16);
      --margin-color: rgba(215, 75, 75, 0.35);
      --cover-theme: #3d2417;
      --active-font: 'Caveat', cursive;
      --active-size: 22px;
      --scale: 1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at center, #232931 0%, #0d1013 100%);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Top Control & Rich Text Header */
    .header-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      z-index: 1000;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      padding: 6px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .btn {
      background: #ffffff;
      border: none;
      padding: 6px 13px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #1e293b;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover { background: #f1f5f9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn.admin-btn { background: #e2ba7d; color: #351f0b; font-weight: 600; }
    .btn.admin-btn:hover { background: #edd09e; }
    .btn.save-btn { background: #16a34a; color: #ffffff; font-weight: 600; }
    .btn.save-btn:hover { background: #15803d; }
    .btn.close-btn { background: #475569; color: #ffffff; font-weight: 500; }
    .btn.close-btn:hover { background: #334155; }

    .page-indicator {
      color: #e2e8f0;
      font-size: 13px;
      min-width: 140px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Rich Text Formatting Ribbon */
    .editor-ribbon {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(20, 24, 30, 0.9);
      backdrop-filter: blur(14px);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .ribbon-group {
      display: flex;
      align-items: center;
      gap: 3px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      padding-right: 7px;
      margin-right: 4px;
    }
    .ribbon-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #e2e8f0;
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.14); }

    .tool-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    .tool-select {
      background: #11151a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 6px;
      outline: none;
      height: 28px;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .color-dot:hover { transform: scale(1.25); }

    /* Book Stage */
    .book-stage {
      perspective: 2500px;
      width: calc(var(--page-w) * 2);
      height: var(--page-h);
      position: relative;
      transform: scale(var(--scale));
      transform-origin: center center;
    }

    /* Desk Container with Smooth Centering When Closed */
    .book-desk {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.35, 0, 0.25, 1);
    }

    /* Centers the single front cover cleanly on the desk */
    .book-desk.closed-front {
      transform: translateX(calc(var(--page-w) * -0.5));
    }

    /* Centers the single back cover cleanly on the desk */
    .book-desk.closed-back {
      transform: translateX(calc(var(--page-w) * 0.5));
    }

    /* Central Spine Shadow */
    .spine-crease {
      position: absolute;
      left: calc(var(--page-w) - 12px);
      top: 0;
      width: 24px;
      height: 100%;
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.45) 0%, 
        rgba(255,255,255,0.06) 50%, 
        rgba(0,0,0,0.45) 100%);
      z-index: 250;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      transition: opacity 0.4s ease;
    }

    .book-desk.closed-front .spine-crease,
    .book-desk.closed-back .spine-crease {
      opacity: 0;
    }

    /* Base Spread Panels */
    .base-page {
      position: absolute;
      top: 0;
      width: var(--page-w);
      height: var(--page-h);
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      transition: opacity 0.3s ease;
    }

    .base-left {
      left: 0;
      border-radius: 6px 0 0 6px;
      z-index: 10;
    }

    .base-right {
      left: var(--page-w);
      border-radius: 0 6px 6px 0;
      z-index: 10;
    }

    /* Hide unused half when book is closed */
    .book-desk.closed-front .base-left {
      opacity: 0;
      pointer-events: none;
      box-shadow: none;
    }
    .book-desk.closed-back .base-right {
      opacity: 0;
      pointer-events: none;
      box-shadow: none;
    }

    /* Dynamic Flipping 3D Leaf */
    .flip-leaf {
      position: absolute;
      top: 0;
      left: var(--page-w);
      width: var(--page-w);
      height: var(--page-h);
      transform-origin: left center;
      transform-style: preserve-3d;
      z-index: 100;
      pointer-events: none;
      display: none;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .flip-leaf.animating {
      display: block;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-leaf .leaf-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .flip-leaf .leaf-front {
      border-radius: 0 6px 6px 0;
    }

    .flip-leaf .leaf-back {
      transform: rotateY(180deg);
      border-radius: 6px 0 0 6px;
    }

    /* Leather Covers */
    .cover-leather {
      background: var(--cover-theme);
      color: #edd19e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(0,0,0,0.4);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.85);
      position: relative;
      height: 100%;
      cursor: pointer;
    }

    .cover-leather::before {
      content: '';
      position: absolute;
      inset: 16px;
      border: 2px dashed rgba(237, 209, 158, 0.4);
      border-radius: 6px;
      pointer-events: none;
    }

    .cover-title {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      padding: 0 35px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .cover-subtitle {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .cover-author {
      position: absolute;
      bottom: 45px;
      font-size: 13px;
      letter-spacing: 1.5px;
      font-style: italic;
    }

    .cover-open-hint {
      margin-top: 24px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(237, 209, 158, 0.15);
      border: 1px solid rgba(237, 209, 158, 0.3);
      padding: 5px 12px;
      border-radius: 14px;
      color: #edd19e;
    }

    .inside-cover {
      background: #eedfc7;
      box-shadow: inset 0 0 45px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #554432;
      height: 100%;
    }

    /* Paper Aesthetics */
    .page-sheet {
      background: var(--paper-bg);
      position: relative;
      height: 100%;
    }

    .page-sheet.left-side::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 45px;
      background: linear-gradient(to left, rgba(0,0,0,0.14) 0%, transparent 100%);
      pointer-events: none;
    }

    .page-sheet.right-side::after {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 45px;
      background: linear-gradient(to right, rgba(0,0,0,0.14) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Rulings */
    .pattern-ruled {
      background-image: 
        linear-gradient(to right, transparent 40px, var(--margin-color) 40px, var(--margin-color) 42px, transparent 42px),
        repeating-linear-gradient(transparent, transparent calc(var(--line-h) - 1px), var(--line-color) calc(var(--line-h) - 1px), var(--line-color) var(--line-h));
      background-position: 0 46px;
    }

    .pattern-grid {
      background-image:
        linear-gradient(to right, var(--line-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line-color) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .pattern-dots {
      background-image: radial-gradient(var(--line-color) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }

    .pattern-blank { background-image: none; }

    .sheet-padding {
      position: absolute;
      inset: 0;
      padding: 50px 32px 42px 48px;
    }

    /* Editor */
    .editor {
      width: 100%;
      height: 100%;
      outline: none;
      border: none;
      background: transparent;
      font-family: var(--active-font);
      font-size: var(--active-size);
      line-height: var(--line-h);
      color: #1f2937;
      word-break: break-word;
      user-select: text;
      overflow-y: auto;
      caret-color: #3b82f6;
      tab-size: 4;
      -moz-tab-size: 4;
    }

    .editor[contenteditable="false"] {
      cursor: not-allowed;
      opacity: 0.88;
    }

    .lock-badge {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(220, 38, 38, 0.12);
      color: #b91c1c;
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .page-sheet.locked .lock-badge { display: flex; }

    .page-footer-num {
      position: absolute;
      bottom: 14px;
      font-size: 12px;
      color: #78716c;
      font-family: 'Cinzel', serif;
    }

    .left-side .page-footer-num { left: 24px; }
    .right-side .page-footer-num { right: 24px; }

    /* Interactive Turn / Hover Zones */
    .turn-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 75px;
      z-index: 200;
      cursor: pointer;
    }

    .turn-zone-right {
      right: 0;
      background: radial-gradient(circle at bottom right, rgba(0,0,0,0.06), transparent 70%);
    }

    .turn-zone-left {
      left: 0;
      background: radial-gradient(circle at bottom left, rgba(0,0,0,0.06), transparent 70%);
    }

    .corner-curl {
      position: absolute;
      bottom: 0;
      width: 48px;
      height: 48px;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      opacity: 0;
    }

    .turn-zone-right .corner-curl {
      right: 0;
      background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.12) 50%, rgba(255,255,255,0.7) 53%, #faf5ea 55%);
      box-shadow: -3px -3px 8px rgba(0,0,0,0.15);
      border-radius: 0 0 6px 0;
    }

    .turn-zone-left .corner-curl {
      left: 0;
      background: linear-gradient(225deg, transparent 50%, rgba(0,0,0,0.12) 50%, rgba(255,255,255,0.7) 53%, #faf5ea 55%);
      box-shadow: 3px -3px 8px rgba(0,0,0,0.15);
      border-radius: 0 0 0 6px;
    }

    .turn-zone:hover .corner-curl {
      opacity: 1;
      width: 65px;
      height: 65px;
    }

    /* Admin Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #1e252d;
      border: 1px solid rgba(255,255,255,0.12);
      width: 500px;
      max-width: 92vw;
      max-height: 85vh;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 { font-size: 17px; font-weight: 600; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    .modal-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .form-group input, .form-group select {
      background: #11151a; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 14px; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #e2ba7d; }

    .palette { display: flex; gap: 10px; margin-top: 4px; }
    .color-swatch {
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s;
    }
    .color-swatch.active { border-color: #fff; transform: scale(1.15); }

    .modal-footer {
      padding: 14px 22px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; background: #161b22;
    }
    .modal-footer button.save {
      background: #e2ba7d; color: #2b1807; font-weight: 600; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Controls & Rich Text Editor Header -->
  <div class="header-panel">
    <!-- Row 1: Book Controls -->
    <div class="top-bar">
      <button class="btn close-btn" id="closeBtn" onclick="toggleCloseBook()">📕 Close Book</button>
      <button class="btn" id="prevBtn" onclick="turnPrev()">◀ Prev</button>
      <span class="page-indicator" id="pageIndicator">Front Cover</span>
      <button class="btn" id="nextBtn" onclick="turnNext()">Next ▶</button>
      <button class="btn save-btn" onclick="manualSave()">💾 Save</button>
      <button class="btn admin-btn" onclick="openAdmin()">⚙️ Admin Panel</button>
      <span style="font-size: 12px; color: #4ade80; min-width: 90px;" id="saveState">Saved ✓</span>
    </div>

    <!-- Row 2: Formatting Ribbon -->
    <div class="editor-ribbon">
      <!-- Font Family -->
      <div class="ribbon-group">
        <select class="tool-select" id="ribbonFont" onchange="setGlobalFont(this.value)">
          <option value="'Caveat', cursive">Handwritten (Caveat)</option>
          <option value="'Kalam', cursive">Casual Script (Kalam)</option>
          <option value="'Special Elite', cursive">Vintage Typewriter</option>
          <option value="'EB Garamond', serif">Classic Book (Garamond)</option>
          <option value="'Inter', sans-serif">Modern Clean (Inter)</option>
        </select>
      </div>

      <!-- Font Size Steppers -->
      <div class="ribbon-group">
        <button class="tool-btn" title="Decrease Font Size" onmousedown="changeSize(-2, event)">A-</button>
        <span id="sizeDisplay" style="font-size: 11px; color:#cbd5e1; min-width:32px; text-align:center;">22px</span>
        <button class="tool-btn" title="Increase Font Size" onmousedown="changeSize(2, event)">A+</button>
      </div>

      <!-- Styles: Bold, Italic, Underline, Strike -->
      <div class="ribbon-group">
        <button class="tool-btn" style="font-weight:900;" title="Bold" onmousedown="execFormat('bold', event)">B</button>
        <button class="tool-btn" style="font-style:italic; font-family:'EB Garamond', serif;" title="Italic" onmousedown="execFormat('italic', event)">I</button>
        <button class="tool-btn" style="text-decoration:underline;" title="Underline" onmousedown="execFormat('underline', event)">U</button>
        <button class="tool-btn" style="text-decoration:line-through;" title="Strikethrough" onmousedown="execFormat('strikeThrough', event)">S</button>
      </div>

      <!-- Paragraph Alignment & Tab Space -->
      <div class="ribbon-group">
        <button class="tool-btn" title="Align Left" onmousedown="execFormat('justifyLeft', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="14" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
        </button>
        <button class="tool-btn" title="Align Center" onmousedown="execFormat('justifyCenter', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="6" y1="12" x2="18" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        </button>
        <button class="tool-btn" title="Align Right" onmousedown="execFormat('justifyRight', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="6" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button class="tool-btn" title="Justify" onmousedown="execFormat('justifyFull', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button class="tool-btn" title="Insert Tab Space (or press Tab key)" onmousedown="insertTab(event)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="17" y2="12"></line><polyline points="13 8 17 12 13 16"></polyline><line x1="21" y1="6" x2="21" y2="18"></line></svg>
        </button>
      </div>

      <!-- Highlighter & Clear Formatting -->
      <div class="ribbon-group">
        <button class="tool-btn" title="Yellow Highlighter" onmousedown="toggleHighlight(event)">🖍️</button>
        <button class="tool-btn" title="Clear Formatting" onmousedown="execFormat('removeFormat', event)">🧹</button>
      </div>

      <!-- Ink Colors -->
      <div class="ribbon-group">
        <div class="color-dot" style="background:#1e3a8a;" title="Ballpoint Blue" onmousedown="setInkColor('#1e3a8a', event)"></div>
        <div class="color-dot" style="background:#111827;" title="Charcoal Black" onmousedown="setInkColor('#111827', event)"></div>
        <div class="color-dot" style="background:#b91c1c;" title="Crimson Red" onmousedown="setInkColor('#b91c1c', event)"></div>
        <div class="color-dot" style="background:#15803d;" title="Forest Green" onmousedown="setInkColor('#15803d', event)"></div>
      </div>
    </div>
  </div>

  <!-- Book Stage -->
  <div class="book-stage" id="bookStage">
    <div class="book-desk closed-front" id="bookDesk">
      <div class="spine-crease"></div>

      <!-- Base Spread -->
      <div class="base-page base-left" id="baseLeft"></div>
      <div class="base-page base-right" id="baseRight"></div>

      <!-- Dynamic Flipping 3D Leaf -->
      <div class="flip-leaf" id="flipLeaf">
        <div class="leaf-face leaf-front" id="leafFront"></div>
        <div class="leaf-face leaf-back" id="leafBack"></div>
      </div>

      <!-- Interactive Turn/Hover Corners -->
      <div class="turn-zone turn-zone-left" id="zoneLeft" onclick="turnPrev()">
        <div class="corner-curl"></div>
      </div>
      <div class="turn-zone turn-zone-right" id="zoneRight" onclick="turnNext()">
        <div class="corner-curl"></div>
      </div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Handbook Configuration & Admin</h3>
        <button class="modal-close" onclick="closeAdmin()">&times;</button>
      </div>
      <div class="modal-body">
        
        <div class="form-group">
          <label>Book Title</label>
          <input type="text" id="cfgTitle" />
        </div>

        <div class="form-group">
          <label>Subtitle / Category</label>
          <input type="text" id="cfgSubtitle" />
        </div>

        <div class="form-group">
          <label>Book Owner / Author</label>
          <input type="text" id="cfgAuthor" />
        </div>

        <div class="form-group">
          <label>Cover Leather Theme</label>
          <div class="palette" id="colorPalette">
            <div class="color-swatch" data-color="#3d2417" style="background:#3d2417;" title="Mahogany"></div>
            <div class="color-swatch" data-color="#1c2738" style="background:#1c2738;" title="Navy Blue"></div>
            <div class="color-swatch" data-color="#182d23" style="background:#182d23;" title="Forest Green"></div>
            <div class="color-swatch" data-color="#3a1820" style="background:#3a1820;" title="Burgundy"></div>
            <div class="color-swatch" data-color="#18181b" style="background:#18181b;" title="Obsidian"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Total Content Pages (Unlimited)</label>
          <input type="number" id="cfgPages" min="2" max="200" step="2" />
        </div>

        <div class="form-group">
          <label>Paper Style</label>
          <select id="cfgPaperStyle">
            <option value="pattern-ruled">Ruled Lined Stationery</option>
            <option value="pattern-grid">Engineering Square Grid</option>
            <option value="pattern-dots">Bullet Dot Grid</option>
            <option value="pattern-blank">Plain Antique Parchment</option>
          </select>
        </div>

        <div class="form-group">
          <label>Lock Particular Pages (Comma separated: e.g. 2, 4)</label>
          <input type="text" id="cfgLockedPages" placeholder="e.g. 2, 4" />
        </div>

        <div class="form-group">
          <label>Sound Effects</label>
          <select id="cfgSound">
            <option value="true">Enabled (Realistic Page Rustle)</option>
            <option value="false">Mute</option>
          </select>
        </div>

      </div>
      <div class="modal-footer">
        <button style="background: none; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer;" onclick="exportData()">Backup JSON</button>
        <button class="save" onclick="applySettings()">Save & Update Book</button>
      </div>
    </div>
  </div>

  <script>
    // Master Unified DB Key
    const DB_KEY = 'realistic_handbook_store_master';

    let bookConfig = {
      title: "CHRONICLES & THOUGHTS",
      subtitle: "OFFICIAL HANDBOOK",
      author: "By John Doe",
      coverColor: "#3d2417",
      pageCount: 10,
      paperStyle: "pattern-ruled",
      fontFamily: "'Caveat', cursive",
      fontSize: 22,
      lockedPages: [],
      soundEnabled: true,
      pagesData: {
        "1": "<h3>Welcome to your A4 Handbook</h3><br>• Click <b>📕 Close Book</b> in the toolbar to close the handbook anytime.<br>• Click the cover or <b>📖 Open Book</b> to reopen.<br>• Every word saves automatically before you turn pages, or click <b>💾 Save</b>.<br>• Use the <b>Tab</b> key or the ⇥ button to indent."
      }
    };

    let spreadIndex = 0;
    let isFlipping = false;

    // Synthesized Audio
    let audioCtx = null;
    function playRustle() {
      if (!bookConfig.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const bufferSize = audioCtx.sampleRate * 0.22;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1150, audioCtx.currentTime);
        filter.Q.setValueAtTime(2.8, audioCtx.currentTime);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      } catch(e) {}
    }

    // Storage Migration & Load: Recovers any previous notes written across all versions
    function loadStorage() {
      let saved = localStorage.getItem(DB_KEY);
      if (!saved) {
        // Try migrating from earlier versions
        const oldKeys = [
          'realistic_handbook_store_v6',
          'realistic_handbook_store_v5',
          'realistic_handbook_store_v4',
          'realistic_handbook_store_v3',
          'realistic_handbook_store_v2',
          'notebook_content_store'
        ];
        for (const k of oldKeys) {
          const oldData = localStorage.getItem(k);
          if (oldData) {
            saved = oldData;
            break;
          }
        }
      }

      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          bookConfig = { 
            ...bookConfig, 
            ...parsed,
            pagesData: { ...bookConfig.pagesData, ...(parsed.pagesData || {}) }
          };
        } catch(e) {
          console.error('Error parsing saved book:', e);
        }
      }
    }

    // Immediate & Guaranteed Persistence: Captures active editor DOM instantly
    function commitAllActiveTextToMemory() {
      document.querySelectorAll('.editor').forEach(el => {
        const p = el.getAttribute('data-pnum');
        if (p) {
          bookConfig.pagesData[p] = el.innerHTML;
        }
      });
    }

    function saveStorage() {
      commitAllActiveTextToMemory();
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(bookConfig));
        const badge = document.getElementById('saveState');
        if (badge) {
          const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          badge.textContent = `Saved (${timeStr}) ✓`;
          badge.style.color = '#4ade80';
        }
      } catch(e) {
        console.error('Save failed:', e);
      }
    }

    let saveTimer;
    function debounceSave() {
      const badge = document.getElementById('saveState');
      if (badge) {
        badge.textContent = 'Saving...';
        badge.style.color = '#e2ba7d';
      }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveStorage, 350);
    }

    function manualSave() {
      saveStorage();
      const badge = document.getElementById('saveState');
      if (badge) {
        badge.textContent = 'Saved to Storage ✓';
        badge.style.color = '#4ade80';
      }
    }

    // Page HTML Generation
    function generatePageHTML(pageType, pageNum) {
      if (pageType === 'cover-front') {
        return `
          <div class="cover-leather" onclick="if(spreadIndex===0) turnNext();">
            <div class="cover-title">${bookConfig.title}</div>
            <div class="cover-subtitle">${bookConfig.subtitle}</div>
            <div class="cover-author">${bookConfig.author}</div>
            <div class="cover-open-hint">Click Cover to Open 📖</div>
          </div>
        `;
      }
      if (pageType === 'ex-libris') {
        return `
          <div class="inside-cover">
            <h4 style="font-family:'Cinzel', serif; letter-spacing:3px; margin-bottom:12px;">EX LIBRIS</h4>
            <div style="border-bottom:1.5px solid #846d52; width:180px; height:24px;"></div>
            <p style="margin-top:14px; font-size:12px; opacity:0.75;">Official Personal Document</p>
          </div>
        `;
      }
      if (pageType === 'cover-back') {
        return `
          <div class="cover-leather" onclick="if(spreadIndex>=getMaxSpread()) turnPrev();">
            <div class="cover-subtitle" style="opacity:0.7;">AUTHENTIC A4 NOTEBOOK</div>
            <div class="cover-open-hint" style="margin-top:20px;">Click to Reopen 📖</div>
          </div>
        `;
      }
      if (pageType === 'inside-back') {
        return `
          <div class="inside-cover">
            <p style="font-family:'Cinzel', serif; font-size:13px; opacity:0.6;">END OF NOTEBOOK</p>
          </div>
        `;
      }
      if (pageType === 'empty') {
        return `<div style="background:transparent; width:100%; height:100%;"></div>`;
      }

      const isLocked = bookConfig.lockedPages.includes(pageNum);
      const isRight = (pageNum % 2 !== 0);

      return `
        <div class="page-sheet ${isRight ? 'right-side' : 'left-side'} ${bookConfig.paperStyle} ${isLocked ? 'locked' : ''}">
          <div class="lock-badge">🔒 Locked</div>
          <div class="sheet-padding">
            <div class="editor" contenteditable="${!isLocked}" spellcheck="false" data-pnum="${pageNum}">${bookConfig.pagesData[pageNum] || ''}</div>
            <div class="page-footer-num">${pageNum}</div>
          </div>
        </div>
      `;
    }

    function getSpreadSpec(idx) {
      const maxContent = bookConfig.pageCount;
      const totalContentSpreads = Math.ceil(maxContent / 2);

      if (idx === 0) {
        return { left: { type: 'empty' }, right: { type: 'cover-front' } };
      }
      if (idx === 1) {
        return { left: { type: 'ex-libris' }, right: { type: 'content', num: 1 } };
      }
      if (idx <= totalContentSpreads) {
        const leftNum = (idx - 1) * 2;
        const rightNum = leftNum + 1;
        return {
          left: { type: 'content', num: leftNum },
          right: { type: 'content', num: rightNum }
        };
      }
      // Closed to Back Cover
      return {
        left: { type: 'cover-back' },
        right: { type: 'empty' }
      };
    }

    function getMaxSpread() {
      return Math.ceil(bookConfig.pageCount / 2) + 1;
    }

    // Dynamic Desk Centering When Closed
    function updateDeskClosedAlignment() {
      const desk = document.getElementById('bookDesk');
      desk.classList.remove('closed-front', 'closed-back');

      if (spreadIndex === 0) {
        desk.classList.add('closed-front');
      } else if (spreadIndex >= getMaxSpread()) {
        desk.classList.add('closed-back');
      }
    }

    function renderCurrentSpread() {
      updateDeskClosedAlignment();

      const spec = getSpreadSpec(spreadIndex);
      const leftEl = document.getElementById('baseLeft');
      const rightEl = document.getElementById('baseRight');

      leftEl.innerHTML = generatePageHTML(spec.left.type, spec.left.num);
      rightEl.innerHTML = generatePageHTML(spec.right.type, spec.right.num);

      // Attach text input, blur, and Tab key listeners
      document.querySelectorAll('.editor').forEach(el => {
        el.addEventListener('input', (e) => {
          const p = e.target.getAttribute('data-pnum');
          bookConfig.pagesData[p] = e.target.innerHTML;
          debounceSave();
        });

        // Instant save on blur
        el.addEventListener('blur', saveStorage);

        // Tab Key Handling
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            if (e.shiftKey) {
              document.execCommand('outdent');
            } else {
              document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
            }
            const p = el.getAttribute('data-pnum');
            bookConfig.pagesData[p] = el.innerHTML;
            debounceSave();
          }
        });
      });

      updateStatusIndicator();
      updateZoneVisibility();
    }

    function updateZoneVisibility() {
      document.getElementById('zoneLeft').style.display = (spreadIndex === 0) ? 'none' : 'block';
      document.getElementById('zoneRight').style.display = (spreadIndex >= getMaxSpread()) ? 'none' : 'block';
    }

    // Close Book Toggle Action
    function toggleCloseBook() {
      commitAllActiveTextToMemory();
      saveStorage();

      if (spreadIndex > 0) {
        // Close the book to Front Cover
        closeBookAnimation();
      } else {
        // Open the book to Page 1
        turnNext();
      }
    }

    function closeBookAnimation() {
      if (isFlipping) return;
      isFlipping = true;
      playRustle();

      const leaf = document.getElementById('flipLeaf');
      const front = document.getElementById('leafFront');
      const back = document.getElementById('leafBack');

      const currentSpec = getSpreadSpec(spreadIndex);
      const coverSpec = getSpreadSpec(0);

      front.innerHTML = generatePageHTML(coverSpec.right.type, coverSpec.right.num);
      back.innerHTML = generatePageHTML(currentSpec.left.type, currentSpec.left.num);

      document.getElementById('baseLeft').innerHTML = generatePageHTML('empty');
      document.getElementById('baseRight').innerHTML = generatePageHTML('cover-front');

      leaf.style.display = 'block';
      leaf.style.transform = 'rotateY(-180deg)';

      requestAnimationFrame(() => {
        leaf.classList.add('animating');
        leaf.style.transform = 'rotateY(0deg)';
      });

      setTimeout(() => {
        spreadIndex = 0;
        renderCurrentSpread();
        leaf.classList.remove('animating');
        leaf.style.display = 'none';
        leaf.style.transform = 'rotateY(0deg)';
        isFlipping = false;
      }, 650);
    }

    function turnNext() {
      if (isFlipping || spreadIndex >= getMaxSpread()) return;
      commitAllActiveTextToMemory();
      saveStorage();

      isFlipping = true;
      playRustle();

      const currentSpec = getSpreadSpec(spreadIndex);
      const nextSpec = getSpreadSpec(spreadIndex + 1);

      const leaf = document.getElementById('flipLeaf');
      const front = document.getElementById('leafFront');
      const back = document.getElementById('leafBack');

      front.innerHTML = generatePageHTML(currentSpec.right.type, currentSpec.right.num);
      back.innerHTML = generatePageHTML(nextSpec.left.type, nextSpec.left.num);

      document.getElementById('baseRight').innerHTML = generatePageHTML(nextSpec.right.type, nextSpec.right.num);

      leaf.style.display = 'block';
      leaf.style.transform = 'rotateY(0deg)';

      requestAnimationFrame(() => {
        leaf.classList.add('animating');
        leaf.style.transform = 'rotateY(-180deg)';
      });

      setTimeout(() => {
        spreadIndex++;
        renderCurrentSpread();
        leaf.classList.remove('animating');
        leaf.style.display = 'none';
        leaf.style.transform = 'rotateY(0deg)';
        isFlipping = false;
      }, 650);
    }

    function turnPrev() {
      if (isFlipping || spreadIndex <= 0) return;
      commitAllActiveTextToMemory();
      saveStorage();

      isFlipping = true;
      playRustle();

      const currentSpec = getSpreadSpec(spreadIndex);
      const prevSpec = getSpreadSpec(spreadIndex - 1);

      const leaf = document.getElementById('flipLeaf');
      const front = document.getElementById('leafFront');
      const back = document.getElementById('leafBack');

      front.innerHTML = generatePageHTML(prevSpec.right.type, prevSpec.right.num);
      back.innerHTML = generatePageHTML(currentSpec.left.type, currentSpec.left.num);

      document.getElementById('baseLeft').innerHTML = generatePageHTML(prevSpec.left.type, prevSpec.left.num);

      leaf.style.display = 'block';
      leaf.style.transform = 'rotateY(-180deg)';

      requestAnimationFrame(() => {
        leaf.classList.add('animating');
        leaf.style.transform = 'rotateY(0deg)';
      });

      setTimeout(() => {
        spreadIndex--;
        renderCurrentSpread();
        leaf.classList.remove('animating');
        leaf.style.display = 'none';
        leaf.style.transform = 'rotateY(0deg)';
        isFlipping = false;
      }, 650);
    }

    function updateStatusIndicator() {
      document.getElementById('prevBtn').disabled = (spreadIndex === 0);
      document.getElementById('nextBtn').disabled = (spreadIndex >= getMaxSpread());

      const ind = document.getElementById('pageIndicator');
      const closeBtn = document.getElementById('closeBtn');

      if (spreadIndex === 0) {
        ind.textContent = "Front Cover";
        closeBtn.textContent = "📖 Open Book";
      } else if (spreadIndex === 1) {
        ind.textContent = "Ex Libris & Page 1";
        closeBtn.textContent = "📕 Close Book";
      } else if (spreadIndex >= getMaxSpread()) {
        ind.textContent = "Back Cover";
        closeBtn.textContent = "📖 Reopen Book";
      } else {
        const leftP = (spreadIndex - 1) * 2;
        const rightP = leftP + 1;
        ind.textContent = `Pages ${leftP} & ${rightP} of ${bookConfig.pageCount}`;
        closeBtn.textContent = "📕 Close Book";
      }
    }

    // Touch & Mouse Drag / Swipe
    let startX = null;
    let startY = null;

    function handleStart(e) {
      if (e.target.isContentEditable) return;
      const touch = e.touches ? e.touches[0] : e;
      startX = touch.clientX;
      startY = touch.clientY;
    }

    function handleEnd(e) {
      if (startX === null) return;
      const touch = e.changedTouches ? e.changedTouches[0] : e;
      const diffX = touch.clientX - startX;
      const diffY = touch.clientY - startY;

      if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          turnNext();
        } else {
          turnPrev();
        }
      }
      startX = null;
      startY = null;
    }

    const desk = document.getElementById('bookDesk');
    desk.addEventListener('mousedown', handleStart);
    window.addEventListener('mouseup', handleEnd);
    desk.addEventListener('touchstart', handleStart, { passive: true });
    window.addEventListener('touchend', handleEnd, { passive: true });

    // Keyboard Arrow Keys
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.isContentEditable) return;
      if (e.key === 'ArrowRight') turnNext();
      if (e.key === 'ArrowLeft') turnPrev();
    });

    // Formatting & Paragraph Execution
    function execFormat(cmd, e) {
      if (e) e.preventDefault();
      document.execCommand(cmd, false, null);
      debounceSave();
    }

    function insertTab(e) {
      if (e) e.preventDefault();
      document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
      debounceSave();
    }

    function setInkColor(col, e) {
      if (e) e.preventDefault();
      document.execCommand('foreColor', false, col);
      debounceSave();
    }

    function toggleHighlight(e) {
      if (e) e.preventDefault();
      document.execCommand('hiliteColor', false, '#fef08a');
      debounceSave();
    }

    function setGlobalFont(font) {
      bookConfig.fontFamily = font;
      document.documentElement.style.setProperty('--active-font', font);
      saveStorage();
      renderCurrentSpread();
    }

    function changeSize(delta, e) {
      if (e) e.preventDefault();
      bookConfig.fontSize = Math.min(36, Math.max(14, bookConfig.fontSize + delta));
      document.documentElement.style.setProperty('--active-size', bookConfig.fontSize + 'px');
      document.getElementById('sizeDisplay').textContent = bookConfig.fontSize + 'px';
      saveStorage();
      renderCurrentSpread();
    }

    // Auto-scale to ensure A4 fits displays
    function autoScale() {
      const maxW = window.innerWidth * 0.94;
      const maxH = window.innerHeight * 0.78;
      const scale = Math.min(maxW / 840, maxH / 594, 1);
      document.documentElement.style.setProperty('--scale', scale);
    }
    window.addEventListener('resize', autoScale);

    // Save on tab close
    window.addEventListener('beforeunload', saveStorage);

    // Admin Panel
    function openAdmin() {
      commitAllActiveTextToMemory();
      document.getElementById('cfgTitle').value = bookConfig.title;
      document.getElementById('cfgSubtitle').value = bookConfig.subtitle;
      document.getElementById('cfgAuthor').value = bookConfig.author;
      document.getElementById('cfgPages').value = bookConfig.pageCount;
      document.getElementById('cfgPaperStyle').value = bookConfig.paperStyle;
      document.getElementById('cfgLockedPages').value = bookConfig.lockedPages.join(', ');
      document.getElementById('cfgSound').value = bookConfig.soundEnabled ? 'true' : 'false';

      document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.classList.toggle('active', swatch.getAttribute('data-color') === bookConfig.coverColor);
        swatch.onclick = () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
        };
      });

      document.getElementById('adminModal').classList.add('open');
    }

    function closeAdmin() {
      document.getElementById('adminModal').classList.remove('open');
    }

    function applySettings() {
      bookConfig.title = document.getElementById('cfgTitle').value.trim() || 'UNTITLED';
      bookConfig.subtitle = document.getElementById('cfgSubtitle').value.trim();
      bookConfig.author = document.getElementById('cfgAuthor').value.trim();
      
      const newPages = parseInt(document.getElementById('cfgPages').value, 10);
      bookConfig.pageCount = Math.max(2, (newPages % 2 === 0 ? newPages : newPages + 1));

      const activeSwatch = document.querySelector('.color-swatch.active');
      if (activeSwatch) bookConfig.coverColor = activeSwatch.getAttribute('data-color');

      bookConfig.paperStyle = document.getElementById('cfgPaperStyle').value;
      bookConfig.soundEnabled = (document.getElementById('cfgSound').value === 'true');

      const lockRaw = document.getElementById('cfgLockedPages').value;
      bookConfig.lockedPages = lockRaw.split(',')
        .map(n => parseInt(n.trim(), 10))
        .filter(n => !isNaN(n));

      document.documentElement.style.setProperty('--cover-theme', bookConfig.coverColor);
      saveStorage();
      renderCurrentSpread();
      closeAdmin();
    }

    function exportData() {
      commitAllActiveTextToMemory();
      const blob = new Blob([JSON.stringify(bookConfig, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Handbook-Backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // Startup
    loadStorage();
    document.documentElement.style.setProperty('--cover-theme', bookConfig.coverColor);
    document.documentElement.style.setProperty('--active-font', bookConfig.fontFamily);
    document.documentElement.style.setProperty('--active-size', bookConfig.fontSize + 'px');
    document.getElementById('sizeDisplay').textContent = bookConfig.fontSize + 'px';
    document.getElementById('ribbonFont').value = bookConfig.fontFamily;
    renderCurrentSpread();
    autoScale();
  </script>
</body>
</html>
